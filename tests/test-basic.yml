name: Test basic SSH setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key pair
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_PRIVATE_KEY }}
          ssh-host: github.com
          ssh-port: '22'
          ssh-socket: '/tmp/ssh-auth-test.sock'

      - name: Assert known_hosts contains github.com
        run: |
          echo "Checking known_hosts for github.com..."
          if ! grep -q "github.com" ~/.ssh/known_hosts 2>/dev/null; then
            echo "FAIL: github.com not found in known_hosts"
            cat ~/.ssh/known_hosts 2>/dev/null || echo "(known_hosts file does not exist)"
            exit 1
          fi
          echo "PASS: github.com found in known_hosts"

      - name: Assert SSH agent socket file exists and has key loaded
        run: |
          echo "Checking SSH agent socket file..."
          SOCK="/tmp/ssh-auth-test.sock"
          if [ ! -S "$SOCK" ]; then
            echo "FAIL: SSH agent socket file not found at $SOCK"
            ls -la /tmp/*.sock 2>/dev/null || echo "(no .sock files in /tmp)"
            exit 1
          fi
          echo "PASS: SSH agent socket exists at $SOCK"
          echo "Checking loaded keys via socket..."
          KEY_COUNT=$(SSH_AUTH_SOCK="$SOCK" ssh-add -l 2>/dev/null | wc -l)
          echo "Keys loaded: $KEY_COUNT"
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: SSH agent has keys loaded"
