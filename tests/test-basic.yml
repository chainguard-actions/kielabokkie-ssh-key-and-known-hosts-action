name: Test basic SSH setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_SSH_PRIVATE_KEY }}
          ssh-host: github.com

      - name: Assert SSH agent is running and key is loaded
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "Checking loaded keys..."
          ssh-add -l
          if [ $? -ne 0 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: SSH agent is running with keys loaded"

      - name: Assert github.com is in known_hosts
        run: |
          echo "Checking known_hosts..."
          if [ ! -f "$HOME/.ssh/known_hosts" ]; then
            echo "FAIL: known_hosts file does not exist"
            exit 1
          fi
          if ! grep -q "github.com" "$HOME/.ssh/known_hosts"; then
            echo "FAIL: github.com not found in known_hosts"
            exit 1
          fi
          echo "PASS: github.com is in known_hosts"
          cat "$HOME/.ssh/known_hosts"
