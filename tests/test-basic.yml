name: Test basic SSH setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t ed25519 -C "test@example.com" -f /tmp/test_key -N ""
          echo "TEST_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        name: Run SSH setup action
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_PRIVATE_KEY }}
          ssh-host: github.com
          ssh-port: '22'
          ssh-keyscan-timeout: '10'
          ssh-socket: '/tmp/ssh-auth-test.sock'

      - name: Assert known_hosts contains github.com
        run: |
          echo "Checking known_hosts for github.com..."
          if ! grep -q "github.com" ~/.ssh/known_hosts 2>/dev/null; then
            echo "FAIL: github.com not found in ~/.ssh/known_hosts"
            cat ~/.ssh/known_hosts || echo "(known_hosts is empty or missing)"
            exit 1
          fi
          echo "PASS: github.com found in known_hosts"

      - name: Assert SSH agent is running and has key loaded
        run: |
          echo "Checking SSH agent..."
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
          KEY_COUNT=$(ssh-add -l 2>/dev/null | wc -l)
          echo "Keys loaded: $KEY_COUNT"
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: SSH agent is running with $KEY_COUNT key(s)"
