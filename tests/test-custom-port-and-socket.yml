name: Test SSH setup with custom port and socket
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_SSH_KEY }}
          ssh-host: github.com
          ssh-port: '22'
          ssh-socket: '/tmp/custom-ssh-auth.sock'

      - name: Assert SSH_AUTH_SOCK is set to custom socket path
        env:
          ACTUAL: ${{ env.SSH_AUTH_SOCK }}
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "PASS: SSH_AUTH_SOCK is set to $SSH_AUTH_SOCK"

      - name: Assert SSH agent has keys loaded
        run: |
          KEY_COUNT=$(ssh-add -l 2>/dev/null | wc -l)
          echo "Keys loaded: $KEY_COUNT"
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: SSH agent has $KEY_COUNT key(s) loaded"

      - name: Assert github.com is in known_hosts
        run: |
          if ! grep -q "github.com" ~/.ssh/known_hosts 2>/dev/null; then
            echo "FAIL: github.com not found in known_hosts"
            cat ~/.ssh/known_hosts 2>/dev/null || echo "(known_hosts does not exist)"
            exit 1
          fi
          echo "PASS: github.com is in known_hosts"
