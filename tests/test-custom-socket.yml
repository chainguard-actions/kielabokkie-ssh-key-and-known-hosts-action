name: Test SSH setup with custom socket
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key_custom -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key_custom >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        name: Run SSH setup action with custom socket
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_SSH_KEY }}
          ssh-host: github.com
          ssh-socket: /tmp/custom-ssh-auth.sock

      - name: Assert known_hosts contains github.com
        run: |
          echo "Checking known_hosts file..."
          if [ ! -f "$HOME/.ssh/known_hosts" ]; then
            echo "FAIL: known_hosts file does not exist"
            exit 1
          fi
          if ! grep -q "github.com" "$HOME/.ssh/known_hosts"; then
            echo "FAIL: github.com not found in known_hosts"
            cat "$HOME/.ssh/known_hosts"
            exit 1
          fi
          echo "PASS: github.com found in known_hosts"

      - name: Assert SSH agent is running on custom socket with key loaded
        env:
          SSH_AUTH_SOCK: /tmp/custom-ssh-auth.sock
        run: |
          echo "Checking SSH agent has keys loaded on custom socket..."
          if [ ! -S "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: Custom socket $SSH_AUTH_SOCK does not exist"
            exit 1
          fi
          KEY_COUNT=$(ssh-add -l 2>/dev/null | wc -l)
          echo "Keys in agent: $KEY_COUNT"
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "FAIL: No keys loaded in SSH agent on custom socket"
            exit 1
          fi
          echo "PASS: SSH agent has $KEY_COUNT key(s) loaded on custom socket"
